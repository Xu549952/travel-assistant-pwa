name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx jest --verbose

      - name: Test summary
        if: always()
        run: |
          echo "## Unit Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run: \`npx jest --verbose\`" >> $GITHUB_STEP_SUMMARY

  lighthouse-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse CI
        run: npx @lhci/cli autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 30

      - name: Generate summary
        if: always()
        run: |
          echo "## Lighthouse CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d ".lighthouseci" ] && ls .lighthouseci/lighthouse-report-*.json 1> /dev/null 2>&1; then
            REPORT=$(ls .lighthouseci/lighthouse-report-*.json | head -1)
            PERF=$(jq -r '.categories.performance.score' "$REPORT")
            A11Y=$(jq -r '.categories.accessibility.score' "$REPORT")
            BP=$(jq -r '.categories["best-practices"].score' "$REPORT")
            SEO=$(jq -r '.categories.seo.score' "$REPORT")
            PWA=$(jq -r '.categories.pwa.score' "$REPORT")
            PERF_PCT=$(awk "BEGIN{printf \"%d\", $PERF*100}")
            A11Y_PCT=$(awk "BEGIN{printf \"%d\", $A11Y*100}")
            BP_PCT=$(awk "BEGIN{printf \"%d\", $BP*100}")
            SEO_PCT=$(awk "BEGIN{printf \"%d\", $SEO*100}")
            PWA_PCT=$(awk "BEGIN{printf \"%d\", $PWA*100}")
            echo "| Category | Score | Threshold |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|-----------|" >> $GITHUB_STEP_SUMMARY
            echo "| Performance | ${PERF_PCT} | >= 85 (error) |" >> $GITHUB_STEP_SUMMARY
            echo "| Accessibility | ${A11Y_PCT} | >= 90 (error) |" >> $GITHUB_STEP_SUMMARY
            echo "| Best Practices | ${BP_PCT} | >= 80 (warn) |" >> $GITHUB_STEP_SUMMARY
            echo "| SEO | ${SEO_PCT} | >= 80 (warn) |" >> $GITHUB_STEP_SUMMARY
            echo "| PWA | ${PWA_PCT} | >= 70 (warn) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "No reports found." >> $GITHUB_STEP_SUMMARY
          fi
